<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="700" height="340" fill="#ffffff"/><text x="350" y="28" font-size="14" fill="#2b2a26" text-anchor="middle" font-weight="bold">腎元：超濾 → 重吸收 → 尿的形成</text><circle cx="120" cy="150" r="52" fill="#ffffff" stroke="#2b2a26" stroke-width="2"/><circle cx="120" cy="150" r="30" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="120" y="154" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="normal">腎小球</text><text x="120" y="220" font-size="10" fill="#7a756a" text-anchor="middle" font-weight="normal">鮑曼氏囊</text><path d="M 172 150 q 70 0 70 50 q 0 50 70 50 q 70 0 70 -40 q 0 -50 70 -50 q 60 0 60 60" fill="none" stroke="#0f766e" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="300" y="118" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="normal">近曲小管</text><text x="430" y="190" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="normal">亨利氏套</text><text x="580" y="96" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="normal">遠曲小管</text><line x1="650" y1="240" x2="650" y2="290" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round"/><line x1="650" y1="290" x2="646.714" y2="283.819" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round"/><line x1="650" y1="290" x2="653.286" y2="283.819" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round"/><text x="650" y="312" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="normal">集尿管 → 膀胱</text><text x="40" y="100" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="normal">血液（高血壓）</text><line x1="46" y1="108" x2="84" y2="128" stroke="#b91c1c" stroke-width="1.8" stroke-linecap="round"/><line x1="84" y1="128" x2="77.0001" y2="128.029" stroke="#b91c1c" stroke-width="1.8" stroke-linecap="round"/><line x1="84" y1="128" x2="80.0612" y2="122.213" stroke="#b91c1c" stroke-width="1.8" stroke-linecap="round"/><text x="40" y="268" font-size="9" fill="#7a756a" text-anchor="start" font-weight="normal">血漿蛋白、血細胞</text><text x="40" y="284" font-size="9" fill="#7a756a" text-anchor="start" font-weight="normal">體積太大不能通過</text><text x="350" y="240" font-size="10" fill="#2b2a26" text-anchor="start" font-weight="normal">超濾：高血壓把血漿成分逼出，形成腎小球濾液</text><text x="350" y="262" font-size="10" fill="#2b2a26" text-anchor="start" font-weight="normal">重吸收：葡萄糖、氨基酸 100%（主動轉運）</text><text x="350" y="282" font-size="10" fill="#2b2a26" text-anchor="start" font-weight="normal">　　　　水 99%（滲透）、鹽 80%、尿素 50%</text><text x="350" y="304" font-size="11" fill="#0f766e" text-anchor="start" font-weight="bold">尿的成分：水、鹽、尿素</text></svg>