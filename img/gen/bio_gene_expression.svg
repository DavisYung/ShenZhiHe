<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="820" height="300" fill="#ffffff"/><text x="410" y="30" font-size="14" fill="#2b2a26" text-anchor="middle" font-weight="bold">基因表達：DNA →（轉錄）→ mRNA →（轉譯）→ 多肽 → 蛋白質</text><rect x="20" y="110" width="150" height="70" rx="10" fill="#f3e8ff" stroke="#6d28d9" stroke-width="2"/><text x="95" y="140" font-size="16" fill="#6d28d9" text-anchor="middle" font-weight="bold">DNA</text><text x="95" y="162" font-size="10" fill="#6d28d9" text-anchor="middle" font-weight="normal">細胞核</text><rect x="240" y="110" width="150" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="315" y="140" font-size="16" fill="#1d4ed8" text-anchor="middle" font-weight="bold">mRNA</text><text x="315" y="162" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="normal">細胞核 → 細胞質</text><rect x="460" y="110" width="150" height="70" rx="10" fill="#e6f3f1" stroke="#0f766e" stroke-width="2"/><text x="535" y="140" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="bold">多肽</text><text x="535" y="162" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="normal">核糖體</text><rect x="660" y="110" width="150" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="735" y="140" font-size="16" fill="#15803d" text-anchor="middle" font-weight="bold">蛋白質</text><text x="735" y="162" font-size="10" fill="#15803d" text-anchor="middle" font-weight="normal">摺叠成形狀</text><line x1="172" y1="145" x2="238" y2="145" stroke="#2b2a26" stroke-width="2" stroke-linecap="round"/><line x1="238" y1="145" x2="231.819" y2="148.286" stroke="#2b2a26" stroke-width="2" stroke-linecap="round"/><line x1="238" y1="145" x2="231.819" y2="141.714" stroke="#2b2a26" stroke-width="2" stroke-linecap="round"/><text x="205" y="132" font-size="11" fill="#6d28d9" text-anchor="middle" font-weight="bold">轉錄</text><text x="205" y="182" font-size="9" fill="#7a756a" text-anchor="middle" font-weight="normal">RNA 聚合酶</text><line x1="392" y1="145" x2="458" y2="145" stroke="#2b2a26" stroke-width="2" stroke-linecap="round"/><line x1="458" y1="145" x2="451.819" y2="148.286" stroke="#2b2a26" stroke-width="2" stroke-linecap="round"/><line x1="458" y1="145" x2="451.819" y2="141.714" stroke="#2b2a26" stroke-width="2" stroke-linecap="round"/><text x="425" y="132" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="bold">轉譯</text><text x="425" y="182" font-size="9" fill="#7a756a" text-anchor="middle" font-weight="normal">核糖體 + tRNA</text><line x1="612" y1="145" x2="658" y2="145" stroke="#2b2a26" stroke-width="2" stroke-linecap="round"/><line x1="658" y1="145" x2="651.819" y2="148.286" stroke="#2b2a26" stroke-width="2" stroke-linecap="round"/><line x1="658" y1="145" x2="651.819" y2="141.714" stroke="#2b2a26" stroke-width="2" stroke-linecap="round"/><text x="635" y="132" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">摺叠</text><text x="410" y="226" font-size="10" fill="#7a756a" text-anchor="middle" font-weight="normal">mRNA 與 DNA 編碼鏈幾乎相同，只是 U 取代 T；tRNA 反密碼子與 mRNA 密碼子互補</text><text x="410" y="250" font-size="10" fill="#7a756a" text-anchor="middle" font-weight="normal">三聯體密碼：每 3 個鹼基對應 1 個氨基酸；AUG 起始、UAA/UAG/UGA 終止</text><text x="410" y="276" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="bold">同一生物的不同細胞基因相同，但基因表達不同 → 細胞分化</text></svg>