<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="700" height="380" fill="#ffffff"/><text x="350" y="28" font-size="15" fill="#2b2a26" text-anchor="middle" font-weight="bold">血糖調節的負反饋機制</text><rect x="270" y="60" width="160" height="56" rx="10" fill="#f3e8ff" stroke="#6d28d9" stroke-width="2"/><text x="350" y="84" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="bold">胰臟（化學感受器）</text><text x="350" y="104" font-size="10" fill="#6d28d9" text-anchor="middle" font-weight="normal">探測血糖水平</text><rect x="40" y="160" width="200" height="66" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="140" y="186" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold">血糖水平上升</text><text x="140" y="208" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="normal">（進食後）</text><line x1="140" y1="156" x2="300" y2="118" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/><line x1="300" y1="118" x2="294.746" y2="122.626" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/><line x1="300" y1="118" x2="293.227" y2="116.231" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/><rect x="40" y="260" width="200" height="80" rx="10" fill="#e6f3f1" stroke="#0f766e" stroke-width="2"/><text x="140" y="284" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">分泌較多胰島素</text><text x="140" y="304" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="normal">＋較少胰高血糖素</text><text x="140" y="324" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">→ 血糖下降</text><line x1="140" y1="228" x2="140" y2="258" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/><line x1="140" y1="258" x2="136.714" y2="251.819" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/><line x1="140" y1="258" x2="143.286" y2="251.819" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/><rect x="460" y="160" width="200" height="66" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="560" y="186" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="bold">血糖水平下降</text><text x="560" y="208" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="normal">（運動時）</text><line x1="560" y1="156" x2="400" y2="118" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/><line x1="400" y1="118" x2="406.773" y2="116.231" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/><line x1="400" y1="118" x2="405.254" y2="122.626" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/><rect x="460" y="260" width="200" height="80" rx="10" fill="#fdf1e3" stroke="#b45309" stroke-width="2"/><text x="560" y="284" font-size="12" fill="#b45309" text-anchor="middle" font-weight="bold">分泌較多胰高血糖素</text><text x="560" y="304" font-size="10" fill="#b45309" text-anchor="middle" font-weight="normal">＋較少胰島素</text><text x="560" y="324" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold">→ 血糖回升</text><line x1="560" y1="228" x2="560" y2="258" stroke="#b45309" stroke-width="2" stroke-linecap="round"/><line x1="560" y1="258" x2="556.714" y2="251.819" stroke="#b45309" stroke-width="2" stroke-linecap="round"/><line x1="560" y1="258" x2="563.286" y2="251.819" stroke="#b45309" stroke-width="2" stroke-linecap="round"/><text x="350" y="200" font-size="10" fill="#7a756a" text-anchor="middle" font-weight="normal">肝／肌肉細胞：葡萄糖 ⇄ 糖原</text><text x="350" y="360" font-size="11" fill="#7a756a" text-anchor="middle" font-weight="normal">定點：正常血糖水平｜負反饋＝產生相反反應以抵消變化</text></svg>