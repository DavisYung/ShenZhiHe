<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="660" height="420" fill="#ffffff"/><text x="330" y="28" font-size="14" fill="#2b2a26" text-anchor="middle" font-weight="bold">植物的兩種運輸：木質部運水（上）、韌皮部運養分</text><rect x="230" y="70" width="200" height="300" rx="8" fill="#fbfdfd" stroke="#2b2a26" stroke-width="2"/><rect x="260" y="90" width="140" height="260" rx="6" fill="#ffffff" stroke="#c9c2b3" stroke-width="1.2"/><rect x="282" y="96" width="14" height="248" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/><rect x="304" y="96" width="14" height="248" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/><rect x="326" y="96" width="14" height="248" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/><rect x="348" y="96" width="14" height="248" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/><rect x="212" y="96" width="9" height="248" rx="3" fill="#fdf1e3" stroke="#b45309" stroke-width="1.2"/><rect x="418" y="96" width="9" height="248" rx="3" fill="#fdf1e3" stroke="#b45309" stroke-width="1.2"/><rect x="226" y="96" width="9" height="248" rx="3" fill="#fdf1e3" stroke="#b45309" stroke-width="1.2"/><rect x="432" y="96" width="9" height="248" rx="3" fill="#fdf1e3" stroke="#b45309" stroke-width="1.2"/><rect x="240" y="96" width="9" height="248" rx="3" fill="#fdf1e3" stroke="#b45309" stroke-width="1.2"/><rect x="446" y="96" width="9" height="248" rx="3" fill="#fdf1e3" stroke="#b45309" stroke-width="1.2"/><rect x="254" y="96" width="9" height="248" rx="3" fill="#fdf1e3" stroke="#b45309" stroke-width="1.2"/><rect x="460" y="96" width="9" height="248" rx="3" fill="#fdf1e3" stroke="#b45309" stroke-width="1.2"/><line x1="330" y1="340" x2="330" y2="110" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/><line x1="330" y1="110" x2="333.286" y2="116.181" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/><line x1="330" y1="110" x2="326.714" y2="116.181" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/><text x="306" y="220" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="bold" transform="rotate(-90 306 220)">木質部</text><line x1="230" y1="110" x2="230" y2="340" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><line x1="230" y1="340" x2="226.714" y2="333.819" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><line x1="230" y1="340" x2="233.286" y2="333.819" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><text x="208" y="230" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold" transform="rotate(-90 208 230)">韌皮部</text><text x="330" y="76" font-size="10" fill="#15803d" text-anchor="middle" font-weight="normal">葉（光合作用製造蔗糖）</text><text x="330" y="392" font-size="10" fill="#15803d" text-anchor="middle" font-weight="normal">根（吸收水和礦物質）</text><text x="470" y="120" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="bold">木質部</text><text x="470" y="142" font-size="10" fill="#2b2a26" text-anchor="start" font-weight="normal">· 由已死細胞構成中空管道</text><text x="470" y="162" font-size="10" fill="#2b2a26" text-anchor="start" font-weight="normal">· 細胞壁木質化，抵抗蒸騰拉力</text><text x="470" y="182" font-size="10" fill="#2b2a26" text-anchor="start" font-weight="normal">· 靠蒸騰拉力向上運水和礦物質</text><text x="470" y="216" font-size="12" fill="#b45309" text-anchor="start" font-weight="bold">韌皮部</text><text x="470" y="238" font-size="10" fill="#2b2a26" text-anchor="start" font-weight="normal">· 由活細胞（篩管＋伴細胞）</text><text x="470" y="258" font-size="10" fill="#2b2a26" text-anchor="start" font-weight="normal">· 篩板有篩孔讓養分通過</text><text x="470" y="278" font-size="10" fill="#2b2a26" text-anchor="start" font-weight="normal">· 以蔗糖形式雙向運輸有機養分</text><text x="330" y="412" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="bold">水：泥土→（滲透）根→（蒸騰拉力）木質導管→葉→（蒸騰）大氣</text></svg>