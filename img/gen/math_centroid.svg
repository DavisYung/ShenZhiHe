<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520" font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif"><rect x="0" y="0" width="700" height="520" fill="#ffffff"/><polygon points="260,80 80,380 440,380" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="260" y="60" font-size="18" fill="#16a34a" text-anchor="middle" font-weight="bold">A</text><text x="60" y="405" font-size="18" fill="#16a34a" text-anchor="middle" font-weight="bold">B</text><text x="460" y="405" font-size="18" fill="#16a34a" text-anchor="middle" font-weight="bold">C</text><line x1="260" y1="80" x2="260" y2="380" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,4" opacity="0.8"/><line x1="80" y1="380" x2="350" y2="230" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,4" opacity="0.8"/><line x1="440" y1="380" x2="170" y2="230" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,4" opacity="0.8"/><circle cx="260" cy="257" r="8" fill="#16a34a"/><text x="260" y="240" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="bold">G 形心</text><line x1="260" y1="257" x2="260" y2="380" stroke="#16a34a" stroke-width="2" stroke-dasharray="3,3"/><text x="235" y="320" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">AG : GM = 2 : 1</text><text x="260" y="440" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">形心：三條中線的交點</text><text x="260" y="465" font-size="12" fill="#6b7280" text-anchor="middle">平衡點（重心），將中線分成 2:1</text><text x="260" y="30" font-size="17" fill="#2b2a26" text-anchor="middle" font-weight="bold">形心 G：中線交點（2:1）</text></svg>