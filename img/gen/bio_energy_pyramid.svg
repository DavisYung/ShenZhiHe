<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="620" height="380" fill="#ffffff"/><text x="310" y="28" font-size="14" fill="#2b2a26" text-anchor="middle" font-weight="bold">生態系能量流：約 90% 能量在每個營養級散失</text><polygon points="105,300 515,300 475,242 145,242" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="276" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">三級消費者（第四級）</text><text x="527" y="276" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="normal">0.1%</text><polygon points="150,242 470,242 430,184 190,184" fill="#fdf1e3" stroke="#b45309" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="218" font-size="12" fill="#b45309" text-anchor="middle" font-weight="bold">次級消費者（第三級）</text><text x="482" y="218" font-size="11" fill="#b45309" text-anchor="start" font-weight="normal">1%</text><polygon points="195,184 425,184 385,126 235,126" fill="#e6f3f1" stroke="#0f766e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="160" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">初級消費者（第二級）</text><text x="437" y="160" font-size="11" fill="#0f766e" text-anchor="start" font-weight="normal">10%</text><polygon points="240,126 380,126 340,68 280,68" fill="#dcfce7" stroke="#15803d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="102" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold">生產者（第一級）</text><text x="392" y="102" font-size="11" fill="#15803d" text-anchor="start" font-weight="normal">100%</text><text x="310" y="330" font-size="11" fill="#7a756a" text-anchor="middle" font-weight="normal">每級只剩約 10% 能量（未攝食／未消化／排泄／呼吸散熱）</text><text x="310" y="356" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="bold">→ 食物鏈通常只有 4-5 級；較短的食物鏈能養活較多消費者</text></svg>