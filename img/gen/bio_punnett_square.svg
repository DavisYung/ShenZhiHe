<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="560" height="400" fill="#ffffff"/><text x="280" y="30" font-size="14" fill="#2b2a26" text-anchor="middle" font-weight="bold">單基因遺傳圖解：Yy × Yy（黃色顯性 × 黃色顯性）</text><text x="120" y="92" font-size="11" fill="#7a756a" text-anchor="end" font-weight="normal">配子</text><text x="250" y="76" font-size="18" fill="#0f766e" text-anchor="middle" font-weight="bold">Y</text><text x="350" y="76" font-size="18" fill="#0f766e" text-anchor="middle" font-weight="bold">y</text><text x="176" y="141" font-size="18" fill="#0f766e" text-anchor="end" font-weight="bold">Y</text><text x="176" y="223" font-size="18" fill="#0f766e" text-anchor="end" font-weight="bold">y</text><rect x="200" y="100" width="100" height="82" rx="6" fill="#fdf1e3" stroke="#b45309" stroke-width="1.8"/><text x="250" y="138" font-size="20" fill="#b45309" text-anchor="middle" font-weight="bold">YY</text><text x="250" y="162" font-size="11" fill="#b45309" text-anchor="middle" font-weight="normal">黃色</text><rect x="300" y="100" width="100" height="82" rx="6" fill="#fdf1e3" stroke="#b45309" stroke-width="1.8"/><text x="350" y="138" font-size="20" fill="#b45309" text-anchor="middle" font-weight="bold">Yy</text><text x="350" y="162" font-size="11" fill="#b45309" text-anchor="middle" font-weight="normal">黃色</text><rect x="200" y="182" width="100" height="82" rx="6" fill="#fdf1e3" stroke="#b45309" stroke-width="1.8"/><text x="250" y="220" font-size="20" fill="#b45309" text-anchor="middle" font-weight="bold">Yy</text><text x="250" y="244" font-size="11" fill="#b45309" text-anchor="middle" font-weight="normal">黃色</text><rect x="300" y="182" width="100" height="82" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/><text x="350" y="220" font-size="20" fill="#15803d" text-anchor="middle" font-weight="bold">yy</text><text x="350" y="244" font-size="11" fill="#15803d" text-anchor="middle" font-weight="normal">綠色</text><text x="280" y="300" font-size="12" fill="#2b2a26" text-anchor="middle" font-weight="normal">基因型比　YY : Yy : yy = 1 : 2 : 1</text><text x="280" y="326" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold">表現型比　黃色 : 綠色 = 3 : 1</text><text x="280" y="356" font-size="11" fill="#7a756a" text-anchor="middle" font-weight="normal">顯性等位基因在純合或雜合都會表現；隱性只在純合時表現</text></svg>