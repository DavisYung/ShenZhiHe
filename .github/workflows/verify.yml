name: verify-build

# 目的：任何改动在合并前都必须能「构建成功 + 11 项自检全绿」。
# 这是对 AI 协作者唯一真正有效的约束——文档会被跳过，CI 不会。

on:
  push:
    branches: [source]
  pull_request:
    branches: [source]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建（唯一入口 site/build.py）
        run: python site/build.py

      - name: 自检（11 项：题数 / 版权 / 搜索 worker / 脚本语法 / 图片引用 / SW 版本 …）
        run: python scripts/verify_build.py

      - name: 题解覆盖率（仅供参考，不阻断）
        run: python site/_expl_coverage.py || true
