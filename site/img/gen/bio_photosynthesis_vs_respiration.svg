<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif"><rect x="0" y="0" width="760" height="360" fill="#ffffff"/><text x="380" y="30" font-size="15" fill="#2b2a26" text-anchor="middle" font-weight="bold">光合作用與呼吸作用：互為逆反應</text><rect x="40" y="70" width="300" height="210" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="190" y="100" font-size="13" fill="#15803d" text-anchor="middle" font-weight="bold">光合作用（合成代謝）</text><text x="190" y="134" font-size="13" fill="#2b2a26" text-anchor="middle" font-weight="normal">二氧化碳 + 水</text><line x1="190" y1="148" x2="190" y2="176" stroke="#15803d" stroke-width="2" stroke-linecap="round"/><line x1="190" y1="176" x2="186.714" y2="169.819" stroke="#15803d" stroke-width="2" stroke-linecap="round"/><line x1="190" y1="176" x2="193.286" y2="169.819" stroke="#15803d" stroke-width="2" stroke-linecap="round"/><text x="238" y="168" font-size="10" fill="#15803d" text-anchor="start" font-weight="normal">光能／葉綠素</text><text x="190" y="200" font-size="13" fill="#15803d" text-anchor="middle" font-weight="bold">葡萄糖 + 氧</text><text x="190" y="232" font-size="11" fill="#7a756a" text-anchor="middle" font-weight="normal">場所：葉綠體</text><text x="190" y="254" font-size="10" fill="#7a756a" text-anchor="middle" font-weight="normal">類囊體（光反應）＋基質（碳固定）</text><rect x="420" y="70" width="300" height="210" rx="12" fill="#fdf1e3" stroke="#b45309" stroke-width="2"/><text x="570" y="100" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">呼吸作用（分解代謝）</text><text x="570" y="134" font-size="13" fill="#2b2a26" text-anchor="middle" font-weight="normal">葡萄糖 + 氧</text><line x1="570" y1="148" x2="570" y2="176" stroke="#b45309" stroke-width="2" stroke-linecap="round"/><line x1="570" y1="176" x2="566.714" y2="169.819" stroke="#b45309" stroke-width="2" stroke-linecap="round"/><line x1="570" y1="176" x2="573.286" y2="169.819" stroke="#b45309" stroke-width="2" stroke-linecap="round"/><text x="618" y="168" font-size="10" fill="#b45309" text-anchor="start" font-weight="normal">酶催化</text><text x="570" y="200" font-size="12" fill="#b45309" text-anchor="middle" font-weight="bold">二氧化碳 + 水 + 能量（ATP）</text><text x="570" y="232" font-size="11" fill="#7a756a" text-anchor="middle" font-weight="normal">場所：細胞質 + 線粒體</text><text x="570" y="254" font-size="10" fill="#7a756a" text-anchor="middle" font-weight="normal">糖酵解 → 克雷伯氏循環 → 氧化磷酸化</text><rect x="345" y="150" width="70" height="40" rx="8" fill="#ffffff" stroke="#2b2a26" stroke-width="1.8"/><text x="380" y="176" font-size="13" fill="#2b2a26" text-anchor="middle" font-weight="bold">ATP</text><line x1="342" y1="170" x2="340" y2="170" stroke="#2b2a26" stroke-width="1.5" stroke-linecap="round"/><line x1="340" y1="170" x2="346.181" y2="166.714" stroke="#2b2a26" stroke-width="1.5" stroke-linecap="round"/><line x1="340" y1="170" x2="346.181" y2="173.286" stroke="#2b2a26" stroke-width="1.5" stroke-linecap="round"/><line x1="418" y1="170" x2="420" y2="170" stroke="#2b2a26" stroke-width="1.5" stroke-linecap="round"/><line x1="420" y1="170" x2="413.819" y2="173.286" stroke="#2b2a26" stroke-width="1.5" stroke-linecap="round"/><line x1="420" y1="170" x2="413.819" y2="166.714" stroke="#2b2a26" stroke-width="1.5" stroke-linecap="round"/><text x="380" y="312" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="bold">能量流：光能 → 化學能（ATP／葡萄糖）→ 熱能散失</text><text x="380" y="338" font-size="10" fill="#7a756a" text-anchor="middle" font-weight="normal">光合作用固定碳，呼吸作用釋放碳；兩者共同維持生態系的碳循環與能量流</text></svg>